; Claude Desktop Buddy firmware
;
; Two environments share the same source tree and build flags. M5Unified
; abstracts the board so the same code runs on the AXP192-based original
; M5StickC Plus and the newer ESP32-S3-based M5StickS3.

[common]
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/>
lib_deps =
    m5stack/M5Unified @ ^0.2.2
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
board_build.f_cpu = 160000000L
build_flags = ${common.build_flags}
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}

[env:m5sticks3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
board_build.filesystem = ${common.board_build.filesystem}
board_build.partitions = ${common.board_build.partitions}
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
upload_speed = 921600
upload_flags =
    --before=usb_reset
    --after=hard_reset
build_flags =
    ${common.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = ${common.build_src_filter}
lib_deps = ${common.lib_deps}
